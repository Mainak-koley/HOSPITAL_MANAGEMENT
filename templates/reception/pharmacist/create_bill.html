{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Create Bill</h2>

    <form method="post">
        {% csrf_token %}

        <label>Total Amount</label>
        <input type="number" step="0.01" name="total_amount" required>

        <button class="btn">Confirm Payment</button>
    </form>
</div>
{% endblock %}
